version: '3.8'

services:
  db-test:
    image: postgres:15
    container_name: testlab-db-test
    environment:
      POSTGRES_DB: testlab_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"

  backend-test:
    build: ./backend
    container_name: testlab-backend-test
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-test:5432/testlab_test
      SPRING_DATASOURCE_USERNAME: test
      SPRING_DATASOURCE_PASSWORD: test
    depends_on:
      - db-test
