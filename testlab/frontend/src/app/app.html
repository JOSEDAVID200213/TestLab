<div class="flex h-screen bg-slate-50 overflow-hidden">
  <!-- Sidebar -->
  <aside class="w-64 bg-slate-900 text-white flex-shrink-0 flex flex-col">
    <div class="p-6">
      <h1 class="text-2xl font-bold flex items-center gap-2">
        <span class="text-emerald-400">🧪</span> TestLab
      </h1>
      <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest font-semibold">QA System</p>
    </div>

    <nav class="flex-1 px-4 space-y-1">
      <a routerLink="/" routerLinkActive="bg-slate-800 text-white" [routerLinkActiveOptions]="{exact: true}" 
         class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-colors">
        <span class="text-lg">📊</span> Dashboard
      </a>
      <a routerLink="/products" routerLinkActive="bg-slate-800 text-white" 
         class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-colors">
        <span class="text-lg">📦</span> Products
      </a>
      <a routerLink="/inventory" routerLinkActive="bg-slate-800 text-white" 
         class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition-colors">
        <span class="text-lg">🔄</span> Inventory
      </a>
    </nav>

    <div class="p-4 border-t border-slate-800">
      <div class="flex items-center gap-3 p-2">
        <div class="w-8 h-8 rounded-full bg-emerald-500 flex items-center justify-center font-bold">JD</div>
        <div class="overflow-hidden">
          <p class="text-sm font-medium truncate">Jose David</p>
          <p class="text-xs text-slate-400 truncate">Admin Mode</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto">
    <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center sticky top-0 z-10">
      <h2 class="text-xl font-semibold text-slate-800">QA Overview</h2>
      <div class="flex items-center gap-4">
        <span class="flex items-center gap-1 text-sm text-slate-500">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span> System Online
        </span>
      </div>
    </header>

    <div class="p-8">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
