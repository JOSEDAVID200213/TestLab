name: 🐛 Bug Report
description: Report a bug or technical incident
title: "[BUG] "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        Please fill out the sections below to help us diagnose and resolve the issue.

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is the impact?
      options:
        - "🔴 Critical — System down, data loss, security breach"
        - "🟠 High — Major feature broken, no workaround"
        - "🟡 Medium — Feature impaired, workaround available"
        - "🟢 Low — Minor issue, cosmetic"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the system is affected?
      options:
        - Backend (Spring Boot API)
        - Frontend (Angular Dashboard)
        - Database (PostgreSQL)
        - CI/CD Pipeline
        - Docker / Infrastructure
        - Performance
        - Security
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise description of the bug.
      placeholder: "When I do X, I expect Y but instead Z happens."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages, stack traces, or screenshots.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant environment details.
      placeholder: |
        - OS: Windows 11
        - Java: 21
        - Docker: 24.0.7
        - Browser: Chrome 120
        - Branch/Commit: main / abc1234
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Trace
      description: Paste any relevant log output.
      render: shell
    validations:
      required: false
